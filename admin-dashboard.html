<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ Studio Dashboard | Payjay Trends</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS Production Build -->
  <link rel="stylesheet" href="output.css">
  <style>
    .premium-transition {
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .fade-in-up {
      animation: fadeInUp 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-brand-light text-brand antialiased min-h-screen flex flex-col">

  <!-- Dynamic Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 premium-transition px-6 py-4 font-semibold text-xs uppercase tracking-premium shadow-2xl bg-brand text-white"></div>

  <!-- Main Container -->
  <div id="admin-app" class="flex-grow flex flex-col">
    <!-- Screen contents rendered dynamically via JS -->
  </div>

  <script>
    // Global Administrative session state
    const adminState = {
      token: sessionStorage.getItem('pj_admin_token') || '',
      products: [],
      orders: [],
      activeTab: 'products',
      uploadBase64: ''
    };

    // Main App entrypoint
    document.addEventListener('DOMContentLoaded', () => {
      renderView();
    });

    function showToast(message, isError = false) {
      const el = document.getElementById('toast');
      el.innerText = message;
      el.className = `fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 premium-transition px-6 py-4 font-semibold text-xs uppercase tracking-premium shadow-2xl text-white ${isError ? 'bg-red-500' : 'bg-green-500'}`;
      setTimeout(() => {
        el.className = `fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 premium-transition px-6 py-4 font-semibold text-xs uppercase tracking-premium shadow-2xl text-white`;
      }, 4000);
    }

    async function apiRequest(url, options = {}) {
      try {
        const res = await fetch(url, options);
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Server error occurred.');
        }
        return data;
      } catch (err) {
        showToast(err.message, true);
        throw err;
      }
    }

    async function logAdminAction(action, description = '') {
      try {
        await apiRequest('/pj-ops-hq/create-user-log', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${adminState.token}`
          },
          body: JSON.stringify({
            user_type: 'admin',
            user_id: null,
            user_email: 'admin',
            action,
            description,
            ip_address: null,
            user_agent: navigator.userAgent,
            metadata: { tab: adminState.activeTab }
          })
        });
      } catch (err) {
        console.warn('Failed to create admin log:', err.message);
      }
    }

    function renderView() {
      const container = document.getElementById('admin-app');
      container.innerHTML = '';

      if (!adminState.token) {
        renderLogin(container);
      } else {
        renderDashboard(container);
      }
    }

    // Passcode Login screen
    function renderLogin(container) {
      container.className = "flex-grow flex items-center justify-center p-4 bg-brand-light";
      container.innerHTML = `
        <div class="bg-white border border-neutral-100 p-8 w-full max-w-sm shadow-2xl text-center fade-in-up">
          <h2 class="text-base uppercase tracking-premium font-extrabold text-brand mb-1">HQ Studio Access</h2>
          <p class="text-xs text-brand-muted mb-8 uppercase tracking-premium font-semibold">Enter executive passcode pin</p>
          <form id="login-form">
            <input type="password" id="passcode" required autocomplete="new-password" class="w-full text-center tracking-[0.6em] text-xl border border-neutral-200 py-3 mb-6 focus:border-brand outline-none premium-transition" placeholder="••••">
            <button type="submit" class="w-full bg-brand text-white py-4 text-xs font-bold uppercase tracking-premium hover:bg-brand-hover premium-transition">Authorize Dashboard</button>
          </form>
        </div>
      `;
      const loginForm = document.getElementById('login-form');
      if (loginForm) {
        loginForm.addEventListener('submit', handleLogin);
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const passcode = document.getElementById('passcode').value;
      
      try {
        const response = await apiRequest('/pj-ops-hq/sign-in-executive', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode })
        });
        
        adminState.token = response.token;
        sessionStorage.setItem('pj_admin_token', response.token);
        showToast('Dashboard Access Authorized.', false);
        await logAdminAction('admin_login', 'Admin logged into dashboard');
        renderView();
      } catch (err) {
        // Error toast triggered by apiRequest
      }
    }

    function handleLogout() {
      adminState.token = '';
      sessionStorage.removeItem('pj_admin_token');
      showToast('Logged out of executive profile.');
      logAdminAction('admin_logout', 'Admin logged out of dashboard');
      renderView();
    }

    // Admin Dashboard View
    async function renderDashboard(container) {
      container.className = "flex-grow flex flex-col bg-brand-light";
      container.innerHTML = `
        <!-- Top Nav -->
        <header class="bg-white border-b border-neutral-100 sticky top-0 z-30">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <span class="text-sm font-extrabold uppercase tracking-widest text-brand">PAYJAY HQ STUDIO</span>
            <button id="admin-logout-btn" class="text-xs uppercase tracking-premium font-bold text-brand-muted hover:text-brand premium-transition">Log Out</button>
          </div>
        </header>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full flex-grow flex">
          <!-- Side Navigation -->
          <div class="w-64 flex-shrink-0 flex flex-col space-y-2">
            <button id="tab-products" class="px-5 py-4 text-left text-xs uppercase tracking-premium font-bold border border-neutral-200 transition-all ${adminState.activeTab === 'products' ? 'bg-brand text-white border-brand shadow-md' : 'bg-white text-brand hover:bg-neutral-50'}">Inventory Manager</button>
            <button id="tab-categories" class="px-5 py-4 text-left text-xs uppercase tracking-premium font-bold border border-neutral-200 transition-all ${adminState.activeTab === 'categories' ? 'bg-brand text-white border-brand shadow-md' : 'bg-white text-brand hover:bg-neutral-50'}">Category Manager</button>
            <button id="tab-orders" class="px-5 py-4 text-left text-xs uppercase tracking-premium font-bold border border-neutral-200 transition-all ${adminState.activeTab === 'orders' ? 'bg-brand text-white border-brand shadow-md' : 'bg-white text-brand hover:bg-neutral-50'}">Order Deliveries</button>
            <button id="tab-customers" class="px-5 py-4 text-left text-xs uppercase tracking-premium font-bold border border-neutral-200 transition-all ${adminState.activeTab === 'customers' ? 'bg-brand text-white border-brand shadow-md' : 'bg-white text-brand hover:bg-neutral-50'}">Customers</button>
            <button id="tab-logs" class="px-5 py-4 text-left text-xs uppercase tracking-premium font-bold border border-neutral-200 transition-all ${adminState.activeTab === 'logs' ? 'bg-brand text-white border-brand shadow-md' : 'bg-white text-brand hover:bg-neutral-50'}">User Logs</button>
            <button id="tab-lookbooks" class="px-5 py-4 text-left text-xs uppercase tracking-premium font-bold border border-neutral-200 transition-all ${adminState.activeTab === 'lookbooks' ? 'bg-brand text-white border-brand shadow-md' : 'bg-white text-brand hover:bg-neutral-50'}">Lookbook Studio</button>
          </div>

          <!-- Dynamic Panel content -->
          <div id="dashboard-content" class="flex-grow flex flex-col ml-8">
            <!-- Loading placeholder -->
            <p class="text-xs uppercase tracking-premium font-bold text-brand-muted text-center py-20">Loading studio files...</p>
          </div>
        </div>

        <!-- Product Modal -->
        <div id="product-modal" class="fixed inset-0 z-50 hidden bg-neutral-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-white border border-neutral-100 w-full max-w-xl p-8 relative shadow-2xl overflow-y-auto max-h-[85vh] fade-in-up">
            <button id="modal-close-btn" class="absolute top-4 right-4 text-2xl hover:scale-110 premium-transition">&times;</button>
            <h3 id="modal-title" class="text-sm font-extrabold uppercase tracking-premium text-brand mb-6">Add New Product</h3>
            
            <form id="product-form">
              <input type="hidden" id="edit-slug">
              
              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Product Name</label>
                <input type="text" id="prod-name" required class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition">
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                  <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Price (GHS)</label>
                  <input type="number" step="0.01" id="prod-price" required class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition">
                </div>
                <div>
                  <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Stock Quantity</label>
                  <input type="number" id="prod-stock" required class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition">
                </div>
              </div>

              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Category</label>
                <select id="prod-category" required class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none bg-white premium-transition">
                  <option value="Men">Men</option>
                  <option value="Women">Women</option>
                  <option value="Kids">Kids</option>
                  <option value="Accessories">Accessories</option>
                </select>
              </div>

              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Product Type</label>
                <select id="prod-product-type" required class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none bg-white premium-transition">
                  <option value="">Select Type...</option>
                  <option value="Shoes">Shoes</option>
                  <option value="Sandals">Sandals</option>
                  <option value="Down Shoes">Down Shoes</option>
                  <option value="Shirts">Shirts</option>
                  <option value="Blazers">Blazers</option>
                  <option value="Pants">Pants</option>
                  <option value="Dresses">Dresses</option>
                  <option value="Skirts">Skirts</option>
                  <option value="T-Shirts">T-Shirts</option>
                  <option value="Overalls">Overalls</option>
                  <option value="Accessories">Accessories</option>
                </select>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                  <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Sizes (Comma separated)</label>
                  <input type="text" id="prod-sizes" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition" placeholder="S, M, L, XL">
                </div>
                <div>
                  <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Colors (Comma separated)</label>
                  <input type="text" id="prod-colors" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition" placeholder="White, Black, Beige">
                </div>
              </div>

              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Product Description</label>
                <textarea id="prod-desc" rows="3" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition"></textarea>
              </div>

              <div class="mb-6">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Image URL</label>
                <input type="text" id="prod-image-url" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition" placeholder="https://unsplash.com/...">
                <p class="text-[9px] text-brand-muted mt-2 uppercase tracking-premium">Or upload a file (converts to base64):</p>
                <input type="file" id="prod-image-file" class="w-full mt-1 border border-neutral-200 px-4 py-2 text-xs bg-brand-light outline-none" accept="image/*">
              </div>

              <div class="mb-6">
                <div class="flex items-center justify-between mb-3">
                  <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted">Regional Pricing</label>
                  <button type="button" id="toggle-regional-pricing" class="text-[10px] uppercase tracking-premium font-bold text-brand hover:text-brand-hover premium-transition">Expand</button>
                </div>
                <div id="regional-pricing-section" class="hidden border border-neutral-200 rounded p-4 bg-neutral-50/50">
                  <p class="text-[10px] text-brand-muted mb-3 uppercase tracking-premium">Tick regions and set custom prices. Leave blank to use the default base price.</p>
                  <div id="regional-pricing-list" class="space-y-2 max-h-[240px] overflow-y-auto pr-1">
                    <!-- Populated dynamically -->
                  </div>
                </div>
              </div>

              <button type="submit" class="w-full bg-brand text-white py-4 text-xs font-bold uppercase tracking-premium hover:bg-brand-hover premium-transition">Save Catalog Item</button>
            </form>
          </div>
        </div>

        <!-- Category Modal -->
        <div id="category-modal" class="fixed inset-0 z-50 hidden bg-neutral-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-white border border-neutral-100 w-full max-w-xl p-8 relative shadow-2xl overflow-y-auto max-h-[85vh] fade-in-up">
            <button id="category-modal-close-btn" class="absolute top-4 right-4 text-2xl hover:scale-110 premium-transition">&times;</button>
            <h3 id="modal-title" class="text-sm font-extrabold uppercase tracking-premium text-brand mb-6">Add New Category</h3>
            
            <form id="category-form">
              <input type="hidden" id="edit-category-slug">
              
              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Category Name</label>
                <input type="text" id="cat-name" required class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition" placeholder="e.g. Kids, Men, Women">
              </div>

              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Slug (URL-friendly)</label>
                <input type="text" id="cat-slug" required class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition" placeholder="e.g. kids, men, women">
                <p class="text-[9px] text-brand-muted mt-1 uppercase tracking-premium">Auto-generated from name if left empty on create</p>
              </div>

              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Description</label>
                <textarea id="cat-description" rows="2" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition" placeholder="Brief description of this category"></textarea>
              </div>

              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Category Image URL</label>
                <input type="text" id="cat-image-url" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition" placeholder="https://images.unsplash.com/...">
                <p class="text-[9px] text-brand-muted mt-2 uppercase tracking-premium">This image will be shown in the sidebar preview</p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                  <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Display Order</label>
                  <input type="number" id="cat-display-order" value="0" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition">
                </div>
                <div>
                  <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Status</label>
                  <select id="cat-is-active" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none bg-white premium-transition">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                  </select>
                </div>
              </div>

              <button type="submit" class="w-full bg-brand text-white py-4 text-xs font-bold uppercase tracking-premium hover:bg-brand-hover premium-transition">Save Category</button>
            </form>
          </div>
        </div>

        <!-- Lookbook Modal -->
        <div id="lookbook-modal" class="fixed inset-0 z-50 hidden bg-neutral-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-white border border-neutral-100 w-full max-w-xl p-8 relative shadow-2xl overflow-y-auto max-h-[85vh] fade-in-up">
            <button id="lookbook-modal-close-btn" class="absolute top-4 right-4 text-2xl hover:scale-110 premium-transition">&times;</button>
            <h3 id="modal-title" class="text-sm font-extrabold uppercase tracking-premium text-brand mb-6">Add New Lookbook</h3>
            
            <form id="lookbook-form">
              <input type="hidden" id="edit-lookbook-slug">
              
              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Title</label>
                <input type="text" id="lb-title" required class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition" placeholder="e.g. Summer Luxe">
              </div>

              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Subtitle</label>
                <input type="text" id="lb-subtitle" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition" placeholder="Short teaser">
              </div>

              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Description</label>
                <textarea id="lb-description" rows="2" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition" placeholder="Brief description"></textarea>
              </div>

              <div class="mb-4">
                <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Cover Image URL</label>
                <input type="text" id="lb-image-url" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition" placeholder="https://images.unsplash.com/...">
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                  <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Display Order</label>
                  <input type="number" id="lb-display-order" value="0" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none premium-transition">
                </div>
                <div>
                  <label class="block text-[10px] uppercase tracking-premium font-bold text-brand-muted mb-2">Status</label>
                  <select id="lb-is-active" class="w-full border border-neutral-200 px-4 py-3 text-sm focus:border-brand outline-none bg-white premium-transition">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                  </select>
                </div>
              </div>

              <button type="submit" class="w-full bg-brand text-white py-4 text-xs font-bold uppercase tracking-premium hover:bg-brand-hover premium-transition">Save Lookbook</button>
            </form>
          </div>
        </div>
      `;

      // Attach event listeners for dashboard elements
      const logoutBtn = document.getElementById('admin-logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', handleLogout);
      }

      const tabProducts = document.getElementById('tab-products');
      if (tabProducts) {
        tabProducts.addEventListener('click', () => switchTab('products'));
      }

      const tabCategories = document.getElementById('tab-categories');
      if (tabCategories) {
        tabCategories.addEventListener('click', () => switchTab('categories'));
      }

      const tabOrders = document.getElementById('tab-orders');
      if (tabOrders) {
        tabOrders.addEventListener('click', () => switchTab('orders'));
      }

      const tabCustomers = document.getElementById('tab-customers');
      if (tabCustomers) {
        tabCustomers.addEventListener('click', () => switchTab('customers'));
      }

      const tabLogs = document.getElementById('tab-logs');
      if (tabLogs) {
        tabLogs.addEventListener('click', () => switchTab('logs'));
      }

      const tabLookbooks = document.getElementById('tab-lookbooks');
      if (tabLookbooks) {
        tabLookbooks.addEventListener('click', () => switchTab('lookbooks'));
      }

      const modalCloseBtn = document.getElementById('modal-close-btn');
      if (modalCloseBtn) {
        modalCloseBtn.addEventListener('click', closeProductModal);
      }

      const productForm = document.getElementById('product-form');
      if (productForm) {
        productForm.addEventListener('submit', handleSaveProduct);
      }

      const imageFile = document.getElementById('prod-image-file');
      if (imageFile) {
        imageFile.addEventListener('change', handleFileSelect);
      }

      const toggleRegionalBtn = document.getElementById('toggle-regional-pricing');
      const regionalSection = document.getElementById('regional-pricing-section');
      if (toggleRegionalBtn && regionalSection) {
        toggleRegionalBtn.addEventListener('click', async () => {
          const isHidden = regionalSection.classList.contains('hidden');
          if (isHidden) {
            regionalSection.classList.remove('hidden');
            toggleRegionalBtn.innerText = 'Collapse';
            const editSlug = document.getElementById('edit-slug').value;
            const productSlug = editSlug || (new URLSearchParams(window.location.search).get('slug'));
            if (editSlug) {
              await loadRegionalPrices(editSlug);
            } else {
              buildRegionalPricingList([]);
            }
          } else {
            regionalSection.classList.add('hidden');
            toggleRegionalBtn.innerText = 'Expand';
          }
        });
      }

      const categoryModalCloseBtn = document.getElementById('category-modal-close-btn');
      if (categoryModalCloseBtn) {
        categoryModalCloseBtn.addEventListener('click', closeCategoryModal);
      }

      const categoryForm = document.getElementById('category-form');
      if (categoryForm) {
        categoryForm.addEventListener('submit', handleSaveCategory);
      }

      const lookbookModalCloseBtn = document.getElementById('lookbook-modal-close-btn');
      if (lookbookModalCloseBtn) {
        lookbookModalCloseBtn.addEventListener('click', closeLookbookModal);
      }

      const lookbookForm = document.getElementById('lookbook-form');
      if (lookbookForm) {
        lookbookForm.addEventListener('submit', handleSaveLookbook);
      }

      // Load correct panel
      await renderTabContent();
    }

    async function switchTab(tab) {
      adminState.activeTab = tab;
      renderView();
    }

    async function renderTabContent() {
      const panel = document.getElementById('dashboard-content');
      
      if (adminState.activeTab === 'products') {
        panel.innerHTML = `
          <div class="flex justify-between items-center mb-6">
            <h3 class="text-xs uppercase tracking-premium font-extrabold text-brand-muted">Inventory Catalog</h3>
            <button id="add-product-btn" class="bg-brand text-white hover:bg-brand-hover px-4 py-3 text-xs font-bold uppercase tracking-premium premium-transition shadow-md">Add Product</button>
          </div>

          <div class="bg-white border border-neutral-100 overflow-x-auto shadow-sm">
            <table class="w-full text-left text-sm border-collapse">
              <thead>
                <tr class="bg-neutral-50 text-[10px] uppercase tracking-premium text-brand font-bold border-b border-neutral-200">
                  <th class="p-4">Thumbnail</th>
                  <th class="p-4">Name</th>
                  <th class="p-4">Category</th>
                  <th class="p-4">Type</th>
                  <th class="p-4">Price</th>

    // ============================================

    const GHANA_REGIONS = [
      'Greater Accra', 'Ashanti', 'Western', 'Central', 'Eastern',
      'Volta', 'Northern', 'Upper East', 'Upper West', 'Bono',
      'Bono East', 'Ahafo', 'Oti', 'Savannah', 'North East', 'Western North'
    ];

    function buildRegionalPricingList(existingPrices = []) {
      const container = document.getElementById('regional-pricing-list');
      if (!container) return;

      const priceMap = new Map();
      existingPrices.forEach(p => priceMap.set(p.region, parseFloat(p.price)));

      container.innerHTML = GHANA_REGIONS.map(region => {
        const price = priceMap.has(region) ? priceMap.get(region).toFixed(2) : '';
        return `
          <div class="flex items-center justify-between py-1.5 border-b border-neutral-100 last:border-0">
            <div class="flex items-center space-x-2">
              <input type="checkbox" class="regional-checkbox h-3.5 w-3.5 rounded border-neutral-300 text-brand focus:ring-brand" data-region="${region}" ${price !== '' ? 'checked' : ''}>
              <span class="text-[11px] font-medium text-brand uppercase tracking-premium">${region}</span>
            </div>
            <input type="number" step="0.01" class="regional-price-input w-24 border border-neutral-200 px-2 py-1.5 text-xs text-right focus:border-brand outline-none premium-transition" placeholder="Base price" value="${price}" data-region="${region}" ${price === '' ? '' : ''}>
          </div>
        `;
      }).join('');
    }

    async function loadRegionalPrices(slug) {
      try {
        const data = await apiRequest(`/pj-ops-hq/get-regional-prices/${slug}`, {
          headers: { 'Authorization': `Bearer ${adminState.token}` }
        });
        buildRegionalPricingList(data.prices || []);
      } catch (err) {
        buildRegionalPricingList([]);
      }
    }

    async function saveRegionalPrices(productId) {
      const checkboxes = document.querySelectorAll('#regional-pricing-list .regional-checkbox');
      const promises = [];

      checkboxes.forEach(cb => {
        const region = cb.getAttribute('data-region');
        const priceInput = document.querySelector(`.regional-price-input[data-region="${region}"]`);
        const price = priceInput ? priceInput.value.trim() : '';

        if (cb.checked && price !== '') {
          promises.push(
            apiRequest('/pj-ops-hq/set-regional-price', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${adminState.token}`
              },
              body: JSON.stringify({ product_id: productId, region, price: parseFloat(price) })
            }).catch(() => {})
          );
        } else if (!cb.checked && price !== '') {
          promises.push(
            apiRequest('/pj-ops-hq/remove-regional-price', {
              method: 'DELETE',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${adminState.token}`
              },
              body: JSON.stringify({ product_id: productId, region })
            }).catch(() => {})
          );
        }
      });

      await Promise.all(promises);
    }

    async function handleSaveProduct(event) {
      event.preventDefault();
      const editSlug = document.getElementById('edit-slug').value;

      const payload = {
        name: document.getElementById('prod-name').value,
        price: parseFloat(document.getElementById('prod-price').value),
        stock: parseInt(document.getElementById('prod-stock').value),
        category: document.getElementById('prod-category').value,
        product_type: document.getElementById('prod-product-type').value,
        sizes: document.getElementById('prod-sizes').value.split(',').map(s => s.trim()).filter(Boolean),
        colors: document.getElementById('prod-colors').value.split(',').map(c => c.trim()).filter(Boolean),
        description: document.getElementById('prod-desc').value,
        image_url: document.getElementById('prod-image-url').value
      };

      try {
        let url = '/pj-ops-hq/push-inventory';
        let method = 'POST';
        let savedProduct = null;

        if (editSlug) {
          url = `/pj-ops-hq/patch-inventory/${editSlug}`;
          method = 'PUT';
        }

        const response = await apiRequest(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${adminState.token}`
          },
          body: JSON.stringify(payload)
        });

        savedProduct = response;
        const action = editSlug ? 'product_updated' : 'product_created';
        const description = editSlug ? `Updated product: ${payload.name}` : `Created new product: ${payload.name}`;
        await logAdminAction(action, description);

        // Save regional prices if the section was expanded
        const section = document.getElementById('regional-pricing-section');
        if (section && !section.classList.contains('hidden')) {
          const productId = savedProduct.id || (await apiRequest(`/pj-secure-boutique/get-shelf/${editSlug}`)).id;
          await saveRegionalPrices(productId);
        }

        showToast('Catalog item saved.');
        closeProductModal();
        await loadInventoryTable();
      } catch (err) {}
    }

        const action = editSlug ? 'category_updated' : 'category_created';
        const description = editSlug ? `Updated category: ${payload.name}` : `Created new category: ${payload.name}`;
        await logAdminAction(action, description);
        
        showToast('Category saved successfully.');
        closeCategoryModal();
        await loadCategoriesTable();
      } catch (err) {}
    }

    async function deleteCategory(slug) {
      if (!confirm('Are you sure you want to delete this category? Products in this category may become uncategorized.')) return;
      
      try {
        await apiRequest(`/pj-ops-hq/purge-category/${slug}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${adminState.token}` }
        });
        await logAdminAction('category_deleted', `Deleted category: ${slug}`);
        showToast('Category deleted successfully.');
        await loadCategoriesTable();
      } catch (err) {}
    }

    // ============================================
    // LOOKBOOK MANAGEMENT
    // ============================================

    async function loadLookbooksTable() {
      const tbody = document.getElementById('lookbooks-rows');
      try {
        const data = await apiRequest('/pj-ops-hq/get-lookbooks', {
          headers: { 'Authorization': `Bearer ${adminState.token}` }
        });

        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-xs text-brand-muted">No lookbooks created yet.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(lb => `
          <tr class="border-b border-neutral-100 hover:bg-neutral-50/50 premium-transition">
            <td class="p-4"><img src="${lb.image_url || 'https://images.unsplash.com/photo-1523170335258-f5ed11844a49?auto=format&fit=crop&q=80&w=100'}" class="h-12 w-12 object-cover bg-neutral-100"></td>
            <td class="p-4 font-semibold text-brand">${lb.title}</td>
            <td class="p-4 text-xs font-mono text-brand-muted">${lb.slug}</td>
            <td class="p-4 font-bold text-xs">${lb.display_order}</td>
            <td class="p-4"><span class="px-2 py-1 text-[9px] font-bold uppercase tracking-premium ${lb.is_active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${lb.is_active ? 'Active' : 'Inactive'}</span></td>
            <td class="p-4 text-right space-x-2">
              <button class="text-xs uppercase font-bold text-blue-500 hover:text-blue-700 premium-transition edit-lookbook-btn" data-slug="${lb.slug}">Edit</button>
              <button class="text-xs uppercase font-bold text-red-500 hover:text-red-700 premium-transition delete-lookbook-btn" data-slug="${lb.slug}">Delete</button>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('.edit-lookbook-btn').forEach(btn => {
          btn.addEventListener('click', () => editLookbook(btn.getAttribute('data-slug')));
        });
        document.querySelectorAll('.delete-lookbook-btn').forEach(btn => {
          btn.addEventListener('click', () => deleteLookbook(btn.getAttribute('data-slug')));
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-xs text-red-500 uppercase tracking-premium">Error loading lookbooks.</td></tr>`;
      }
    }

    function openLookbookModal() {
      document.getElementById('modal-title').innerText = 'Add New Lookbook';
      document.getElementById('lookbook-form').reset();
      document.getElementById('edit-lookbook-slug').value = '';
      document.getElementById('lookbook-modal').classList.remove('hidden');
    }

    function closeLookbookModal() {
      document.getElementById('lookbook-modal').classList.add('hidden');
    }

    async function editLookbook(slug) {
      openLookbookModal();
      document.getElementById('modal-title').innerText = 'Edit Lookbook';

      try {
        const lb = await apiRequest(`/pj-secure-boutique/get-lookbook/${slug}`);
        document.getElementById('edit-lookbook-slug').value = lb.slug;
        document.getElementById('lb-title').value = lb.title;
        document.getElementById('lb-subtitle').value = lb.subtitle || '';
        document.getElementById('lb-description').value = lb.description || '';
        document.getElementById('lb-image-url').value = lb.image_url || '';
        document.getElementById('lb-display-order').value = lb.display_order || 0;
        document.getElementById('lb-is-active').value = lb.is_active ? 'true' : 'false';
      } catch (err) {}
    }

    async function handleSaveLookbook(event) {
      event.preventDefault();
      const editSlug = document.getElementById('edit-lookbook-slug').value;

      const payload = {
        title: document.getElementById('lb-title').value,
        subtitle: document.getElementById('lb-subtitle').value,
        description: document.getElementById('lb-description').value,
        image_url: document.getElementById('lb-image-url').value,
        display_order: parseInt(document.getElementById('lb-display-order').value) || 0,
        is_active: document.getElementById('lb-is-active').value === 'true'
      };

      try {
        let url = '/pj-ops-hq/push-lookbook';
        let method = 'POST';

        if (editSlug) {
          url = `/pj-ops-hq/patch-lookbook/${editSlug}`;
          method = 'PUT';
        }

        await apiRequest(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${adminState.token}`
          },
          body: JSON.stringify(payload)
        });

        const action = editSlug ? 'lookbook_updated' : 'lookbook_created';
        const description = editSlug ? `Updated lookbook: ${payload.title}` : `Created new lookbook: ${payload.title}`;
        await logAdminAction(action, description);

        showToast('Lookbook saved successfully.');
        closeLookbookModal();
        await loadLookbooksTable();
      } catch (err) {}
    }

    async function deleteLookbook(slug) {
      if (!confirm('Are you sure you want to delete this lookbook?')) return;

      try {
        await apiRequest(`/pj-ops-hq/purge-lookbook/${slug}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${adminState.token}` }
        });
        await logAdminAction('lookbook_deleted', `Deleted lookbook: ${slug}`);
        showToast('Lookbook deleted successfully.');
        await loadLookbooksTable();
      } catch (err) {}
    }

    // ============================================
    // USER LOGS
    // ============================================

    async function loadUserLogsTable() {
      const tbody = document.getElementById('user-logs-rows');
      try {
        const data = await apiRequest('/pj-ops-hq/get-user-logs', {
          headers: { 'Authorization': `Bearer ${adminState.token}` }
        });
        
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-xs text-brand-muted">No user logs recorded yet.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(log => `
          <tr class="border-b border-neutral-100 hover:bg-neutral-50/50 premium-transition">
            <td class="p-4 text-xs text-brand-muted">${new Date(log.created_at).toLocaleString()}</td>
            <td class="p-4">
              <span class="px-2 py-1 text-[9px] font-bold uppercase tracking-premium ${log.user_type === 'admin' ? 'bg-purple-100 text-purple-800' : log.user_type === 'customer' ? 'bg-blue-100 text-blue-800' : 'bg-neutral-100 text-neutral-800'}">${log.user_type || 'system'}</span>
            </td>
            <td class="p-4 text-xs font-medium text-brand">${log.user_email || '-'}</td>
            <td class="p-4 text-xs font-bold uppercase tracking-premium text-brand">${log.action}</td>
            <td class="p-4 text-xs text-brand-muted">${log.description || '-'}</td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-xs text-red-500 uppercase tracking-premium">Error loading user logs.</td></tr>`;
      }
    }
  </script>
</body>
</html>
